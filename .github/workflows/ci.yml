name: ci

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - created

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - run: |
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          go build ./...

      - id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/remarkable/githubusermanager
          # Tag the image to match the refs people pass to `uses:` so the
          # composite action can pull `...:${{ github.action_ref }}` without
          # any hardcoded version to bump before a release:
          #   - push to main        -> `main`
          #   - release vX.Y.Z       -> `vX.Y.Z`, `vX.Y`, `vX` (moving tags)
          #   - any build            -> `sha-<shortsha>` (for debugging/pinning)
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
          labels: |
            org.opencontainers.image.vendor=reMarkable
            org.opencontainers.image.documentation=https://github.com/reMarkable/githubUserManager
            org.opencontainers.image.authors=Marcus Ramberg <marcus.ramberg@remarkable.com>
            maintainer=reMarkable

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
